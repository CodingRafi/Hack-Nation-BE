description = "Django ASGI backend: streams AI results to the web via WebSocket"
requires-python = ">=3.13"
dependencies = [
    "channels>=4.3.2",
    "channels-redis>=4.3.0",
    "daphne>=4.2.3",
    "django>=6.1.1",
    "django-cors-headers>=4.9.0",
    "djangorestframework>=3.18.1",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
]
